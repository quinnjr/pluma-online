# Local development environment for pluma-online.
#
# Usage:
#   cp .env.example .env   # then edit secrets
#   docker compose up --build
#
# - The webapp runs `pnpm dev` against a bind-mounted source tree (Vite HMR).
# - Postgres data persists in a named volume; remove with `docker compose down -v`.
# - For production, build the standalone image from Dockerfile (no compose needed).

name: pluma-online

services:
  database:
    image: postgres:17-alpine
    container_name: pluma-online-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pluma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pluma}
      POSTGRES_DB: ${POSTGRES_DB:-pluma}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pluma-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pluma-net

  webapp:
    container_name: pluma-online
    build:
      context: ./
      dockerfile: Dockerfile.dev
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${WEBAPP_PORT:-5173}:5173"
    volumes:
      - ./:/app
      # Anonymous volume preserves the image's installed node_modules so the
      # host bind mount doesn't shadow them with an empty/stale tree.
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pluma}:${POSTGRES_PASSWORD:-pluma}@database:5432/${POSTGRES_DB:-pluma}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me-in-production-at-least-32-chars}
      ROOT_EMAIL: ${ROOT_EMAIL:-root@pluma.local}
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped
    networks:
      - pluma-net

volumes:
  pluma-pgdata:

networks:
  pluma-net:
    driver: bridge
